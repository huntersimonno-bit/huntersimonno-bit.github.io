<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Kemi ❤️</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="floating-decor decor1">♡</div>
  <div class="floating-decor decor2">✦</div>
  <div class="floating-decor decor3">🐸</div>
  <div class="floating-decor decor4">🐱</div>

  <main>

    <section id="opening" class="opening">
      <div class="opening-card">

        <p class="small-text">a little something for you</p>

        <h1>For Kemi ❤️</h1>

        <p class="intro">
          I made you a little something...
        </p>

        <button id="openButton" class="main-button">
          Open it ❤️
        </button>

        <p class="joke">
          no frogs were emotionally harmed in the making of this website 🐸
        </p>

      </div>
    </section>


    <section id="letterSection" class="letter-section hidden">

      <div class="letter-card">

        <div class="heart-decoration">♡</div>

        <h2>Kemi, my love,</h2>

        <div id="letterText" class="letter-text"></div>

        <span id="cursor" class="cursor">|</span>

        <div id="frogArea" class="frog-area hidden">

          <div class="frog">🐸</div>

          <button id="frogButton" class="frog-button">
            click me
          </button>

          <p id="frogMessage" class="frog-message hidden">
            The frog approves of this relationship. 🐸❤️
          </p>

        </div>

      </div>

    </section>

  </main>


  <iframe
    id="musicFrame"
    class="music-frame"
    allow="autoplay"
    title="background music">
  </iframe>


  <script src="script.js"></script>

</body>
</html>
